name: Release

# Push a tag like v1.0.0 to build a signed MSIX and publish it as a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'   # must match the TargetFramework in the .csproj

      - uses: microsoft/setup-msbuild@v2

      - name: Set package version from the tag (v1.2.3 -> 1.2.3.0)
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v') + ".0"
          $manifest = "KensakuCmdPal/Package.appxmanifest"   # adjust the path if needed
          (Get-Content $manifest -Raw) -replace '(<Identity[^>]*Version=")[^"]*(")', "`${1}$v`${2}" |
            Set-Content $manifest -NoNewline

      - name: Restore signing certificate
        shell: pwsh
        env:
          CERT_PFX_BASE64: ${{ secrets.CERT_PFX_BASE64 }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\signing.pfx", [Convert]::FromBase64String($env:CERT_PFX_BASE64))

      - name: Restore
        run: msbuild KensakuCmdPal.sln /t:Restore /p:Configuration=Release /p:Platform=x64

      - name: Build signed MSIX
        env:
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: >
          msbuild KensakuCmdPal.sln
          /p:Configuration=Release
          /p:Platform=x64
          /p:GenerateAppxPackageOnBuild=true
          /p:AppxPackageSigningEnabled=true
          /p:PackageCertificateKeyFile="$env:RUNNER_TEMP\signing.pfx"
          /p:PackageCertificatePassword="$env:CERT_PASSWORD"
          /p:AppxBundle=Never
          /p:UapAppxPackageBuildMode=SideLoadOnly
          /p:AppxPackageDir="${{ github.workspace }}\AppPackages\"

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem AppPackages -Recurse -Include *.msix, *.cer | ForEach-Object FullName
          gh release create "${{ github.ref_name }}" @files --title "${{ github.ref_name }}" --generate-notes
